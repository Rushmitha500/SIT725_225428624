<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books Catalog</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: #2d3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .book-list {
      list-style: none;
      padding: 0;
    }

    .book-item {
      background: white;
      margin-bottom: 15px;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .book-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .book-author {
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>Books Catalog</h1>
    <p>MVC Books App using Node.js and Express</p>
  </header>

  <main>
    <ul id="bookList" class="book-list"></ul>
  </main>

  <script>
    const bookList = document.getElementById('bookList');

    fetch('/api/books')
      .then((response) => response.json())
      .then((books) => {
        books.forEach((book) => {
          const li = document.createElement('li');
          li.className = 'book-item';
          li.innerHTML = `
            <div class="book-title">${book.title}</div>
            <div class="book-author">Author: ${book.author}</div>
          `;
          bookList.appendChild(li);
        });
      })
      .catch((error) => {
        console.error('Error fetching books:', error);
        bookList.innerHTML = '<li>Failed to load books.</li>';
      });
  </script>
</body>
</html>
